name: meron
title: Meron
base: core22
adopt-info: meron
summary: Modern mail and feed client
description: |
  Meron is a modern mail and feed client. It speaks IMAP/SMTP and reads RSS
  feeds, with a fast Rust core engine bundled as a sidecar.

grade: stable
confinement: strict
compression: xz
# Explicit icon so snapcraft doesn't resolve Icon=meron via the hicolor theme:
# its lookup compares size dirs as strings ("96x96" > "512x512"), so a stage
# package shipping hicolor/96x96 makes it point at a nonexistent meron.xpm.
# The path is resolved against the project dir before any part builds, so it
# must point at the staged source file, not the organized prime path.
icon: snap/local/meron.png

# The Wails app (desktop/build/bin/meron) and desktop/icon assets are produced by
# the GitHub Actions workflow before snapcraft runs. The `dump` part just stages
# the prebuilt files into the snap; no compilation happens inside snapcraft.
parts:
  meron:
    plugin: dump
    source: snap/local
    # Track the version declared in desktop/wails.json so the snap version always
    # follows the app version without editing this file.
    override-build: |
      craftctl default
      version="$(sed -n 's/.*"productVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$CRAFT_PROJECT_DIR/desktop/wails.json")"
      craftctl set version="$version"
    organize:
      meron: bin/meron
      meron.desktop: usr/share/applications/meron.desktop
      meron.png: usr/share/icons/hicolor/512x512/apps/meron.png
    stage-packages:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libgles2

apps:
  meron:
    command: bin/meron
    extensions: [gnome]
    desktop: usr/share/applications/meron.desktop
    slots:
      - meron
    plugs:
      - home
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - browser-support
      # Manual-connect: snapd never auto-connects this, so out of the box the
      # Secret Service is denied and the core falls back to its local file
      # keyring. Connecting the interface later enables the desktop keyring for
      # new profiles; profiles already using the fallback remain on it.
      - password-manager-service
      - audio-playback

slots:
  # Owned by the single-instance lock. The release build patches Wails to claim
  # the app ID (desktop/build/linux/wails-single-instance-dbus-name.patch)
  # because the store's snap declaration grants this name only.
  meron:
    interface: dbus
    bus: session
    name: jp.nonbili.meron
